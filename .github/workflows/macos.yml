name: macOS app

# Builds Memoreei-x86_64.dmg and Memoreei-arm64.dmg. Called by release.yml on a tag
# (which attaches them to the GitHub Release); run it by hand, or on a pull request that
# touches the app, to get the DMGs as workflow artifacts.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "macos/**"
      - "pyproject.toml"
      - ".github/workflows/macos.yml"

jobs:
  build:
    # GitHub has no Intel macOS runners left: both architectures are assembled on Apple
    # Silicon. Nothing in the bundle runs during the build, so that's fine; only arm64
    # can be smoke-tested here.
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check the lock still satisfies pyproject.toml
        run: macos/lock.sh --check

      - name: Build
        run: macos/build.sh ${{ matrix.arch }} --dmg

      - name: Smoke test (launch, key, serve, search)
        if: matrix.arch == 'arm64'
        run: macos/smoke-test.sh macos/build/arm64/Memoreei.app

      - uses: actions/upload-artifact@v4
        with:
          name: Memoreei-${{ matrix.arch }}.dmg
          path: macos/build/${{ matrix.arch }}/Memoreei-${{ matrix.arch }}.dmg
          if-no-files-found: error
