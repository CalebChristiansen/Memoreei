name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -x -q

  # After the DMGs and the Linux packages build as well: a release is PyPI, both DMGs
  # and the six Linux files, or nothing.
  publish:
    needs: [test, macos, linux]
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  macos:
    needs: test
    uses: ./.github/workflows/macos.yml

  linux:
    needs: test
    uses: ./.github/workflows/linux.yml

  github-release:
    needs: [publish, macos, linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: Memoreei-*.dmg
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          files: |
            Memoreei-*.dmg
            memoreei_*.deb
            memoreei-*.rpm
            memoreei-*-linux-*.tar.gz
